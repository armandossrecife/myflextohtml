server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: resolve "backend" a cada requisição, assim o nginx
    # sobe mesmo que o Tomcat ainda não esteja pronto.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # API: mesma origem do SWF, então o Flash/Ruffle não precisa de crossdomain.xml
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ~* \.swf$ {
        types { application/x-shockwave-flash swf; }
        add_header Cache-Control "no-cache";
    }
}
