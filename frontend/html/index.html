<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda de Contatos (Adobe Flex)</title>
    <style>
        html, body { margin: 0; height: 100%; background: #F4F6F8; font-family: Arial, sans-serif; }
        #app { width: 100%; height: calc(100% - 28px); }
        #app embed, #app ruffle-embed, #app ruffle-object { width: 100%; height: 100%; display: block; }
        footer { height: 28px; line-height: 28px; font-size: 12px; color: #666; padding: 0 12px; }
        footer a { color: #1C4E80; }
    </style>
    <script>
        // Ruffle: emulador de Flash Player em WebAssembly (os navegadores atuais não têm mais o plugin Flash).
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            letterbox: "off",
            allowNetworking: "all",
            contextMenu: "on",
            splashScreen: false,
            // Se o navegador ainda tiver o plugin Flash (ex.: navegadores legados), ele é usado.
            favorFlash: true
        };
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="app">
    <embed src="Agenda.swf"
           type="application/x-shockwave-flash"
           flashvars="apiUrl=api"
           allowScriptAccess="sameDomain"
           allowNetworking="all"
           quality="high"
           bgcolor="#F4F6F8"
           width="100%" height="100%">
</div>
<footer>
    Agenda.swf rodando via <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>.
    API REST: <a href="api/health" target="_blank">/api/health</a> ·
    <a href="api/contatos" target="_blank">/api/contatos</a> ·
    SWF direto (Flash Player Projector): <a href="Agenda.swf">Agenda.swf</a>
</footer>
</body>
</html>
